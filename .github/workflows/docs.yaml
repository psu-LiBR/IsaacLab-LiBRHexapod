# Docs sanity check only. Upstream's version of this workflow also builds
# a multi-version doc set and deploys it to gh-pages nightly — this fork
# doesn't publish its own docs site (the docs/ tree is upstream's generic
# Isaac Lab reference material, not hexapod-specific; CLAUDE.md is the
# actual documentation for this fork's work), so this just confirms the
# Sphinx build still succeeds when docs/** changes.

name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Docs (sanity check)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        architecture: x64

    - name: Install dev requirements
      working-directory: ./docs
      run: pip install -r requirements.txt

    - name: Build current version docs
      working-directory: ./docs
      run: make current-docs
