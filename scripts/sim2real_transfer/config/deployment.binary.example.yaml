# Deployment config for the `binary` profile (Isaac-Goal-Flat-Hexapod-Binary-v0).
#
# Copy to deployment.yaml (gitignored) and calibrate every "# CALIBRATE" field against
# the real robot before trusting it. This differs from deployment.example.yaml in the
# joint convention: the binary env runs on the HexapI USD, whose leg joints use POSITIVE
# angles (stance 0.46 rad / lift 1.18 rad, limits [-0.087, 1.92]) rather than the old
# USD's negative -0.47 rest pose. See CLAUDE.md's "Hexapod-Specific Details" and the
# binary-RL README.

serial:
  port: /dev/ttyUSB0
  baud_rate: 1000000
  protocol_version: 2.0

joints:
  # Sim DOF order -- matches asset.data.joint_names / the policy's action order.
  sim_order:
    - BackLink
    - FrontLink
    - MiddleLeft
    - MiddleRight
    - BackLeft
    - BackRight
    - FrontLeft
    - FrontRight

  # Real DOF order -- matches hexapod_tripod_adaptive.py's DXL_ID column order.
  real_order:
    - FrontLink
    - BackLink
    - FrontRight
    - FrontLeft
    - MiddleRight
    - MiddleLeft
    - BackRight
    - BackLeft

  motor_ids:
    FrontLink: 3
    BackLink: 6
    FrontRight: 2
    FrontLeft: 1
    MiddleRight: 4
    MiddleLeft: 5
    BackRight: 7
    BackLeft: 8

  # sim rad -> real rad, per real-order joint name (applied before tick conversion).
  #   unchanged:      real = sim
  #   negate:         real = -sim
  #   leg_minus_pi:   real = sim - pi     (HexapI leg convention -- see joint_mapping.py)
  # `leg_minus_pi` is this robot's calibrated `leg_negate_minus_pi` (real = -sim_old - pi)
  # rewritten for the HexapI leg-sign flip (sim_hexapi = -sim_old): real = sim_hexapi - pi.
  # Same -pi phase branch, so the identical real encoder angle and the identical calibrated
  # leg zero_tick carry over unchanged from the velocity/goal deployment.yaml.
  correction_group:
    BackLink: unchanged
    FrontLink: negate
    FrontRight: leg_minus_pi
    FrontLeft: leg_minus_pi
    MiddleRight: leg_minus_pi
    MiddleLeft: leg_minus_pi
    BackRight: leg_minus_pi
    BackLeft: leg_minus_pi

  # real_rad = (tick - zero_tick) / ticks_per_rad,  ticks_per_rad = 4096 / (2*pi) ~= 651.9
  # Body joints: 12-bit encoder, zero_tick=2048 (confirmed, imu_processor.py/gait_generator.py).
  # Leg joints: because leg_minus_pi maps to the identical real encoder angle as the old
  # calibrated leg_negate_minus_pi, COPY the leg zero_tick values straight from your
  # calibrated velocity/goal deployment.yaml -- they transfer unchanged. The ~3500 below is
  # only an in-range placeholder (this robot's measured rest tick ~1720-1864 at 0.46-pi rad
  # implies zero_tick ~= 3500); CALIBRATE / copy the real values before trusting these.
  encoder:
    ticks_per_rev: 4096
    zero_tick:
      FrontLink: 2048
      BackLink: 2048
      FrontRight: 3500   # CALIBRATE (copy from calibrated velocity/goal deployment.yaml)
      FrontLeft: 3500    # CALIBRATE (copy from calibrated velocity/goal deployment.yaml)
      MiddleRight: 3500  # CALIBRATE (copy from calibrated velocity/goal deployment.yaml)
      MiddleLeft: 3500   # CALIBRATE (copy from calibrated velocity/goal deployment.yaml)
      BackRight: 3500    # CALIBRATE (copy from calibrated velocity/goal deployment.yaml)
      BackLeft: 3500     # CALIBRATE (copy from calibrated velocity/goal deployment.yaml)

  # Soft position limits in sim radians, per sim-order joint name. Targets are clipped to
  # these before every write. Legs: the HexapI USD limits [-0.087, 1.92] with a little
  # margin. Spine: the sinusoid stays within ~+-0.87 rad. CALIBRATE against the physical
  # range of motion.
  soft_limits_rad:
    BackLink: [-1.2, 1.2]
    FrontLink: [-1.2, 1.2]
    MiddleLeft: [-0.05, 1.9]
    MiddleRight: [-0.05, 1.9]
    BackLeft: [-0.05, 1.9]
    BackRight: [-0.05, 1.9]
    FrontLeft: [-0.05, 1.9]
    FrontRight: [-0.05, 1.9]

imu:
  topic: /imu
  mount_offset_quat: [1.0, 0.0, 0.0, 0.0]  # CALIBRATE
  negate_gyro_z: true
  max_staleness_s: 0.25

control:
  rate_hz: 50.0
  action_scale: 0.5           # unused by the binary profile (bits are absolute), kept for the loader
  # HexapI defaults: legs +0.47 rad, spine 0.0 (source/isaaclab_assets/.../hexapod.py).
  # Used for the joint_pos_rel observation term and as the soft-start / bring-up-damping pose.
  q_default_sim:
    BackLink: 0.0
    FrontLink: 0.0
    MiddleLeft: 0.47
    MiddleRight: 0.47
    BackLeft: 0.47
    BackRight: 0.47
    FrontLeft: 0.47
    FrontRight: 0.47
  soft_start_seconds: 3.0
  soft_stop_seconds: 2.0
  action_scale_multiplier: 1.0  # <1.0 damps the whole target toward q_default for bring-up

commands:
  velocity:
    vx: 0.2
    vy: 0.0
    yaw_rate: 0.0
  goal:
    x: 2.0
    y: 0.0
    z: 0.0
    heading: 0.0

# Binary-profile-only. Values mirror hexapod_binary_env_cfg.py (STANCE_POS / LIFT_POS /
# SPINE_AMPLITUDE / SPINE_PHASE / SPINE_OFFSET / GAIT_PERIOD_S). Spine joint names use the
# sim-DOF names (no `_Joint` suffix). leg_joint_order is the policy action-index order and
# must match HexapodBinaryActionsCfg's term declaration order.
binary:
  stance_pos: 0.460194236365692
  lift_pos: 1.180398216278
  leg_joint_order: [FrontRight, FrontLeft, MiddleRight, MiddleLeft, BackRight, BackLeft]
  spine:
    period: 1.0
    amplitude:
      BackLink: -0.850309
      FrontLink: -0.844198
    phase:
      BackLink: -0.732694
      FrontLink: 0.462744
    offset:
      BackLink: 0.012033
      FrontLink: -0.006512
