# Deployment config for the `binary` profile (Isaac-Goal-Flat-Hexapod-Binary-v0).
#
# Copy to deployment.yaml (gitignored) and set `serial.port` for your host. Unlike the other example configs, the
# joint / IMU values here are this robot's real calibration (bench tests 2026-07-17 / -19 / -21), not
# placeholders; re-measure only if the hardware changed.
#
# The binary env runs on the HexapI USD, whose leg joints use positive angles (stance 0.46 / lift 1.18 rad,
# limits [-0.087, 1.92]); the pre-HexapI USD of the velocity / goal policies used the mirrored negative range.
#
# How the joint map is derived. The calibrated velocity/goal deployment.yaml maps old-USD sim radians to the
# robot: legs `unchanged`, BackLink `unchanged`, FrontLink `negate`, per-joint zero_tick ~2042-2102 (real_rad = 0
# sits near the encoder midpoint 2048).
#   * Legs: the HexapI USD flips the leg sign (sim_hexapi = -sim_old), so real = -sim_hexapi -> `negate`.
#     zero_tick is the real_rad = 0 tick, independent of the sim convention, so the calibrated values carry over.
#   * Spine: the RL env plays Wave 1 (see "CANONICAL SPINE-WAVE DEFINITION" in hexapod_binary_env_cfg.py), a
#     single-harmonic wave of period 1.0 s and amplitude -0.9162978573 rad on both joints (FrontLink = -A*sin,
#     BackLink = -A*cos). The `binary.spine` block below carries the sim's wave verbatim, and both spine joints
#     use `negate` (real = -sim) because the motors are mounted opposite to the sim convention. The real encoders
#     therefore follow FrontLink = +A*sin, BackLink = +A*cos, and the read-back converts to exactly what the policy
#     saw in training.
#
# Spine bring-up (settled 2026-10-20):
#   * BackLink leads FrontLink by +pi/2, as in sim.
#   * Do not flip individual amplitude signs to change a bend direction: it drives the motors correctly but
#     converts the read-back with the wrong sign, so the policy's joint_pos / joint_vel observations stop matching
#     training. Change the correction groups instead.
#   * Verified on hardware: open-loop replays walk forward and match the sim video with these signs; the mirrored
#     wave walks backward and half a cycle out of phase.
# `tools/check_body_alignment.py` and stage 4 (`--no-torque`) are useful sanity checks (level reads
# projected_gravity ~[0, 0, -1]; a single stance bit drops that leg ~0.72 rad). Do not touch the leg calibration
# when adjusting the spine.

serial:
  port: /dev/ttyUSB0
  baud_rate: 1000000
  protocol_version: 2.0

joints:
  # Sim DOF order -- matches asset.data.joint_names of the HexapI articulation. The joint_pos
  # and joint_vel obs slots are filled by position in this order, so it must match what the
  # sim prints at startup. HexapiFlattened.usd lists the spine first (FrontLink, BackLink) and
  # the legs Middle, Front, Back; the pre-HexapI USD (deployment.example.yaml) listed
  # BackLink, FrontLink and the legs Middle, Back, Front. Check yours against a sim run with
  # `robot.data.joint_names` before deploying a different USD.
  sim_order:
    - FrontLink
    - BackLink
    - MiddleLeft
    - MiddleRight
    - FrontLeft
    - FrontRight
    - BackLeft
    - BackRight

  # Real DOF order -- matches hexapod_tripod_adaptive.py's DXL_ID column order.
  real_order:
    - FrontLink
    - BackLink
    - FrontRight
    - FrontLeft
    - MiddleRight
    - MiddleLeft
    - BackRight
    - BackLeft

  motor_ids:
    FrontLink: 3
    BackLink: 6
    FrontRight: 2
    FrontLeft: 1
    MiddleRight: 4
    MiddleLeft: 5
    BackRight: 7
    BackLeft: 8

  # sim rad (HexapI convention) -> real rad, per real-order joint name.
  #   unchanged: real = sim
  #   negate:    real = -sim
  # Legs: `negate` -- the HexapI leg-sign flip on top of the calibrated old-USD
  # `unchanged` leg map (see header). Spine: both joints `negate` (settled 2026-10-20, see
  # header "HARDWARE BRING-UP"): `binary.spine` emits the sim's wave verbatim (-A on both
  # joints) and these groups turn it into the real encoder wave +A*sin / +A*cos.
  correction_group:
    BackLink: negate
    FrontLink: negate
    FrontRight: negate
    FrontLeft: negate
    MiddleRight: negate
    MiddleLeft: negate
    BackRight: negate
    BackLeft: negate

  # real_rad = (tick - zero_tick) / ticks_per_rad,  ticks_per_rad = 4096/(2*pi) ~= 651.9
  # Calibrated velocity/goal values, copied verbatim -- zero_tick is the real_rad=0
  # tick and does not depend on the sim sign convention. (2026-07-17 3-pose fit for
  # the legs; 2026-07-17 two-extreme midpoint for the body joints.)
  encoder:
    ticks_per_rev: 4096
    zero_tick:
      FrontLink: 2053
      BackLink: 2042
      FrontRight: 2101
      FrontLeft: 2059
      MiddleRight: 2091
      MiddleLeft: 2089
      BackRight: 2089
      BackLeft: 2102

  # Soft position limits in sim (HexapI) radians, per sim-order joint name. Targets
  # are clipped to these before every write.
  #   Legs:  the calibrated hand-ROM safety bounds (2026-07-21), negated into the
  #          HexapI sign convention (old [-a, -b] -> HexapI [b, a]). Wide (~3 rad):
  #          hard safety stops, not the stance/lift operating band.
  #   Spine: the calibrated physical body bounds. FrontLink is `negate` as before; BackLink
  #          switched from `unchanged` to `negate` on 2026-10-20, so its sim-space bounds are
  #          mirrored ([-1.0007, 1.1157] -> [-1.1157, 1.0007]) to keep the same real limits.
  soft_limits_rad:
    BackLink: [-1.1157, 1.0007]   # mirrored vs the old `unchanged` map: same physical limits
    FrontLink: [-1.1095, 1.1754]
    MiddleLeft: [0.1285, 3.1036]
    MiddleRight: [0.0292, 3.0563]
    BackLeft: [0.0676, 3.2000]
    BackRight: [-0.0433, 3.0709]
    FrontLeft: [-0.0011, 3.0445]
    FrontRight: [0.0445, 2.9742]

imu:
  topic: /imu
  # [w, x, y, z], IMU-frame -> sim-body-frame. Calibrated 2026-07-17: composes the
  # static-tilt fit with the horizontal forward/left axis remap from
  # log_imu_axis_alignment_test.py (forward ~= IMU +X, left ~= IMU +Y -- the raw
  # BNO085 axes were already near sim convention, so this is a small nudge).
  # Cross-checked 4 ways (orthogonality 0.00deg, two gyro-vs-gravity checks 0.98/0.99,
  # composed-vs-self-contained 0.00deg).
  mount_offset_quat: [0.999907, 0.003191, -0.011824, 0.005921]
  # This mount's yaw sign was verified CCW-positive by a full-rotation test
  # (2026-07-16): raw gyro_z needs no negation.
  negate_gyro_z: false
  max_staleness_s: 0.25

control:
  rate_hz: 50.0
  action_scale: 0.5           # unused by the binary profile (bits are absolute), kept for the loader
  # HexapI defaults: legs +0.47 rad, spine 0.0 (source/isaaclab_assets/.../hexapod.py).
  # Used for the joint_pos_rel observation term and as the soft-start / bring-up-damping pose.
  q_default_sim:
    BackLink: 0.0
    FrontLink: 0.0
    MiddleLeft: 0.47
    MiddleRight: 0.47
    BackLeft: 0.47
    BackRight: 0.47
    FrontLeft: 0.47
    FrontRight: 0.47
  soft_start_seconds: 3.0
  soft_stop_seconds: 2.0
  action_scale_multiplier: 1.0  # <1.0 damps the whole target toward q_default for bring-up

commands:
  velocity:
    vx: 0.2
    vy: 0.0
    yaw_rate: 0.0
  goal:
    # mode: fixed    -> walk to (x, y) and stop (body-frame pose_command shrinks to 0).
    # mode: receding -> keep a goal `lookahead_m` ahead of the robot's estimate every
    #                   step, so the policy never leaves its "keep walking" regime and
    #                   does not slow near a target. `heading` is then the world
    #                   direction to hold (rad); position drift cancels, only the
    #                   gyro-integrated heading is used. See sim2real/command_source.py.
    #                   For continuous forward walking, set:  mode: receding
    mode: fixed
    lookahead_m: 2.0
    x: 5.0
    y: 0.0
    z: 0.0
    heading: 0.0

# Optional. Omit entirely to keep the default 0.15 m/s (a rough sim-derived guess).
# Only used for `fixed`-mode navigation accuracy -- `receding` mode only depends on
# the localizer's heading, not its position estimate, so this value doesn't matter
# there. Set it from a known-distance walk test (walk T seconds, measure actual
# displacement d, use d/T) once you have one.
localization:
  forward_speed_estimate: 0.15

# Binary-profile-only. `stance_pos` / `lift_pos` mirror STANCE_POS / LIFT_POS in hexapod_binary_env_cfg.py, and
# `leg_joint_order` is the policy action-index order (HexapodBinaryActionsCfg's term order). The `spine` block
# plays Wave 1 on the host: q(t) = offset + amplitude * sin(2*pi*t / period + phase), with BackLink shifted +pi/2
# (a cosine).
binary:
  stance_pos: 0.460194236365692
  lift_pos: 1.180398216278
  leg_joint_order: [FrontRight, FrontLeft, MiddleRight, MiddleLeft, BackRight, BackLeft]
  spine:
    period: 1.0
    # the sim's wave verbatim (-A on both joints); see the header before changing any sign
    amplitude:
      BackLink: -0.9162978573
      FrontLink: -0.9162978573
    phase:
      BackLink: 1.5707963267948966
      FrontLink: 0.0
    offset:
      BackLink: 0.0
      FrontLink: 0.0
